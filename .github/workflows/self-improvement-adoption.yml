name: Gooo authorized self-improvement adoption

on:
  workflow_dispatch:
    inputs:
      authorize_adoption:
        description: Explicit caller authorization for this bounded adoption run
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
      authority_id:
        description: Stable caller-provided authority identifier
        required: true
        type: string

permissions:
  contents: read

env:
  GOOO_REF: 97944bfd4d606420bb163edc766a0cf2d9c5453f

jobs:
  authorized-adoption:
    name: Consume explicit authorization and adopt in temp output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout conformance lab
        uses: actions/checkout@v5

      - name: Checkout pinned Gooo compiler
        uses: actions/checkout@v5
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: ${{ env.GOOO_REF }}
          path: meta-ontology-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Observe, propose, and adopt with explicit authorization
        shell: bash
        env:
          AUTHORIZE_ADOPTION: ${{ inputs.authorize_adoption }}
          AUTHORITY_ID: ${{ inputs.authority_id }}
        run: |
          set -euo pipefail
          mkdir -p observation proposal authorization adoption certificate retention
          (cd meta-ontology-go && go run ./cmd/gooo observe \
            ../fixtures/self-improvement-observation/observation.gooo \
            --input ../fixtures/self-improvement-observation/input.gooo \
            --out ../observation)
          (cd meta-ontology-go && go run ./cmd/gooo propose \
            ../observation/compiler-observation.json \
            --out ../proposal)
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          if os.environ["AUTHORIZE_ADOPTION"] != "true":
              raise SystemExit("explicit adoption authorization was not granted")
          proposal_path = Path("proposal/adoption-proposal.json")
          proposal = json.loads(proposal_path.read_text())
          authorization = {
              "schema": "gooo/semantic-self-adoption-authorization/v1",
              "authorization_id": os.environ["AUTHORITY_ID"],
              "authorization_mode": "explicit-human-input",
              "proposal_digest": "sha256:" + hashlib.sha256(proposal_path.read_bytes()).hexdigest(),
              "candidate_stable_id": proposal["candidate"]["stable_id"],
              "candidate_input_digest": proposal["candidate"]["input_digest"],
              "contract_digest": proposal["contract_digest"],
              "input_source_digest": proposal["input_source_digest"],
              "authorized": True,
              "repository_writes": 0,
              "local_test_executions": 0,
          }
          Path("authorization/explicit.json").write_text(json.dumps(authorization, indent=2) + "\n")
          PY
          (cd meta-ontology-go && go run ./cmd/gooo adopt \
            ../fixtures/self-improvement-observation/observation.gooo \
            --input ../fixtures/self-improvement-observation/input.gooo \
            --observation ../observation/compiler-observation.json \
            --proposal ../proposal/adoption-proposal.json \
            --authorization ../authorization/explicit.json \
            --out ../adoption)
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("adoption/adoption-result.json").read_text())
          if report.get("independent_decision") != "CLOSED":
              raise SystemExit("explicit authorization did not close adoption")
          evidence = report.get("evidence", {})
          if not evidence.get("reuse_applied"):
              raise SystemExit("adoption did not report bounded reuse")
          if report.get("repository_writes") != 0:
              raise SystemExit("authorized adoption declared repository writes")
          print("verified caller-authorized bounded adoption")
          PY

          (cd meta-ontology-go && go run ./cmd/gooo certify \
            ../fixtures/self-improvement-observation/observation.gooo \
            --input ../fixtures/self-improvement-observation/input.gooo \
            --observation ../observation/compiler-observation.json \
            --proposal ../proposal/adoption-proposal.json \
            --authorization ../authorization/explicit.json \
            --adoption ../adoption/adoption-result.json \
            --out ../certificate)
          test -s certificate/retained-knowledge-certificate.json
          test -s certificate/retention-before.json

          (cd meta-ontology-go && go run ./cmd/gooo consume \
            ../fixtures/self-improvement-observation/observation.gooo \
            --input ../fixtures/self-improvement-observation/input.gooo \
            --observation ../observation/compiler-observation.json \
            --proposal ../proposal/adoption-proposal.json \
            --authorization ../authorization/explicit.json \
            --adoption ../adoption/adoption-result.json \
            --certificate ../certificate/retained-knowledge-certificate.json \
            --out ../retention)
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("retention/retention-result.json").read_text())
          if result.get("decision") != "CLOSED":
              raise SystemExit("retained certificate was not consumed as CLOSED")
          if result.get("metrics", {}).get("certificate_hits") != 1:
              raise SystemExit("retention result did not record one certificate hit")
          if result.get("repository_writes") != 0:
              raise SystemExit("retention consumption declared repository writes")
          print("verified separate-invocation retained certificate consumption")
          PY

      - name: Upload authorized adoption receipt
        uses: actions/upload-artifact@v5
        with:
          name: gooo-authorized-adoption
          path: |
            observation
            proposal
            authorization/explicit.json
            adoption
            certificate
            retention
