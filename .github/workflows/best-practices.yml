name: Gooo best-practice corpus

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gooo-conformance-lab-${{ github.workflow }}
  cancel-in-progress: true

env:
  GOOO_REF: 46fe6f28fe7cd03fea904bcdbcbf21ac881f8d5e

jobs:
  execute-corpus:
    name: Execute every .gooo best-practice fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout conformance lab
        uses: actions/checkout@v5

      - name: Checkout pinned Gooo compiler
        uses: actions/checkout@v5
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: ${{ env.GOOO_REF }}
          path: meta-ontology-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: meta-ontology-go/go.mod

      - name: Generate and verify corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated receipts
          started_at_ms="$(date +%s%3N)"
          python3 - <<'PY0'
          import json
          from pathlib import Path

          catalog = json.loads(Path("fixtures/best-practices/catalog.json").read_text())
          if catalog.get("schema") != "gooo/best-practice-corpus/v1":
              raise SystemExit("unexpected best-practice catalog schema")
          listed = sorted(item.get("source", "") for item in catalog.get("cases", []))
          actual = sorted(path.name for path in Path("fixtures/best-practices").glob("*.gooo"))
          if listed != actual or len({item.get("id") for item in catalog.get("cases", [])}) != len(listed):
              raise SystemExit("best-practice catalog does not exactly cover the .gooo corpus")
          print(f"catalog covers {len(actual)} .gooo fixtures")
          PY0
          count=0
          pids=()
          for source in fixtures/best-practices/*.gooo; do
            (
              name="$(basename "$source" .gooo)"
              read -r generation root target < <(python3 ci/catalog_case.py "$name")
              if [ "$generation" = "FAIL_CLOSED" ]; then
              if (cd meta-ontology-go && go run ./cmd/gooo generate --json "../$source" --out "../generated/$name") > "receipts/$name.json"; then
                echo "runtime binding generation unexpectedly succeeded" >&2
                exit 1
              fi
              else
              if ! (cd meta-ontology-go && go run ./cmd/gooo generate --json "../$source" --out "../generated/$name") > "receipts/$name.json"; then
                cat "receipts/$name.json"
                echo "generation failed for $source" >&2
                exit 1
              fi
              python3 ci/verify_gooo_generate.py "receipts/$name.json"
              test -n "$(find "generated/$name" -type f -name '*.go' -print -quit)"
              fi
              fi
              if [ "$generation" = "FAIL_CLOSED" ]; then
                SOURCE_FILE="$source" python3 - <<'PY4'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"])
          receipt = json.loads((Path("receipts") / (source.stem + ".json")).read_text())
          diagnostics = receipt.get("diagnostics", [])
          if receipt.get("status") != "error" or not any(
              item.get("code") == "generator.generate"
              and "runtime bindings are unsupported" in item.get("message", "")
              for item in diagnostics
          ):
              raise SystemExit(f"runtime binding generation boundary was not explicit for {source.name}")
          print(f"recorded expected runtime binding generation boundary for {source.name}")
          PY4
              fi
              if ! (cd meta-ontology-go && go run ./cmd/gooo query --json "../$source" --exact --root "$root" --relation prov:used --target "$target" --limit 10) > "receipts/$name-query.json"; then
                cat "receipts/$name-query.json"
                echo "query failed for $source" >&2
                exit 1
              fi
              python3 ci/verify_gooo_query_case.py "receipts/$name-query.json" "$root" "$target"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          expected_count="$(python3 ci/catalog_case.py --count)"
          count="$(find receipts -maxdepth 1 -type f -name '*-query.json' -print | wc -l | tr -d ' ')"
          test "$count" -eq "$expected_count"
          generation_query_wall_ms=$(( $(date +%s%3N) - started_at_ms ))
          printf 'module gooo.generated\n\ngo 1.27\n' > generated/go.mod
          compile_started_at_ms="$(date +%s%3N)"
          (cd generated && go test ./...)
          compile_wall_ms=$(( $(date +%s%3N) - compile_started_at_ms ))
          echo "Verified generated Go compilation for the PASS corpus." >> "$GITHUB_STEP_SUMMARY"
          runtime_started_at_ms="$(date +%s%3N)"
          if ! (cd meta-ontology-go && go run ./cmd/gooo run --json \
            --entry Process \
            --input ../fixtures/best-practices/run-input.json \
            ../fixtures/best-practices/09-runtime-plan.gooo) > receipts/runtime.json; then
            cat receipts/runtime.json
            exit 1
          fi
          python3 - <<'PY2'
          import json
          from pathlib import Path

          runtime = json.loads(Path("receipts/runtime.json").read_text())
          if runtime.get("schema") != "gooo/value-execution-plan/v1":
              raise SystemExit("unexpected runtime receipt schema")
          if runtime.get("decision") != "PASS":
              raise SystemExit("Gooo runtime did not pass the value plan")
          if not runtime.get("execution", {}).get("activities"):
              raise SystemExit("runtime receipt contains no executed activity")
          print("verified Gooo value execution plan")
          PY2
          if ! (cd meta-ontology-go && go run ./cmd/gooo run --json \
            --entry Produce \
            --input ../fixtures/best-practices/run-input.json \
            ../fixtures/best-practices/10-runtime-chain.gooo) > receipts/runtime-chain.json; then
            cat receipts/runtime-chain.json
            exit 1
          fi
          if ! (cd meta-ontology-go && go run ./cmd/gooo run --json \
            --entry Produce \
            --input ../fixtures/best-practices/run-input.json \
            ../fixtures/best-practices/10-runtime-chain.gooo) > receipts/runtime-chain-replay.json; then
            cat receipts/runtime-chain-replay.json
            exit 1
          fi
          python3 - <<'PY3'
          import json
          from pathlib import Path

          runtime = json.loads(Path("receipts/runtime-chain.json").read_text())
          replay = json.loads(Path("receipts/runtime-chain-replay.json").read_text())
          if runtime.get("decision") != "PASS":
              raise SystemExit("Gooo runtime chain did not pass")
          execution = runtime.get("execution", {})
          replay_execution = replay.get("execution", {})
          if execution.get("activities") != ["Produce", "Consume"]:
              raise SystemExit("runtime chain activity order was not deterministic")
          if execution.get("deliveries") != 1:
              raise SystemExit("runtime chain did not deliver one bound result")
          for field in ("plan_digest", "input_digest", "execution_digest"):
              if not execution.get(field) or not replay_execution.get(field):
                  raise SystemExit(f"runtime provenance field missing: {field}")
          if execution["plan_digest"] != replay_execution["plan_digest"]:
              raise SystemExit("runtime plan digest changed across replay")
          if execution["input_digest"] != replay_execution["input_digest"]:
              raise SystemExit("runtime input digest changed across replay")
          if execution["execution_digest"] != replay_execution["execution_digest"]:
              raise SystemExit("runtime execution digest changed across replay")
          print("verified bound Gooo runtime chain")
          print("verified deterministic runtime provenance replay")
          PY3
          if ! (cd meta-ontology-go && go run ./cmd/gooo compare --json \
            ../receipts/runtime-chain.json \
            ../receipts/runtime-chain-replay.json) > receipts/runtime-chain-comparison.json; then
            cat receipts/runtime-chain-comparison.json
            exit 1
          fi
          python3 - <<'PY4'
          import json
          from pathlib import Path

          comparison = json.loads(Path("receipts/runtime-chain-comparison.json").read_text())
          if comparison.get("schema") != "gooo/value-execution-replay-comparison/v1":
              raise SystemExit("unexpected replay comparison schema")
          if comparison.get("state") != "CLOSED":
              raise SystemExit("runtime replay comparison did not close")
          if comparison.get("reason") != "DETERMINISTIC_REPLAY":
              raise SystemExit("runtime replay comparison reason was not explicit")
          if not all(comparison.get(field) for field in ("same_plan", "same_input", "same_execution")):
              raise SystemExit("runtime replay comparison did not preserve identity")
          print("verified compiler replay comparison boundary")
          PY4
          python3 - <<'PY5'
          import json
          from pathlib import Path

          tampered = json.loads(Path("receipts/runtime-chain-replay.json").read_text())
          tampered["execution"]["activities"] = ["Tampered"]
          Path("receipts/runtime-chain-tampered.json").write_text(
              json.dumps(tampered, indent=2) + "\n"
          )
          PY5
          if (cd meta-ontology-go && go run ./cmd/gooo compare --json \
            ../receipts/runtime-chain.json \
            ../receipts/runtime-chain-tampered.json) > receipts/runtime-chain-tampered-comparison.json; then
            echo "tampered runtime receipt was accepted" >&2
            exit 1
          fi
          python3 - <<'PY6'
          import json
          from pathlib import Path

          comparison = json.loads(Path("receipts/runtime-chain-tampered-comparison.json").read_text())
          if comparison.get("state") != "REFUTED":
              raise SystemExit("tampered runtime receipt was not refuted")
          if comparison.get("reason") != "REPLAY_RECEIPT_DIGEST_INVALID":
              raise SystemExit("tampered runtime receipt reason was not explicit")
          if comparison.get("next_operation") != "PRESERVE_COUNTEREXAMPLE_AND_OPEN_REPAIR_CANDIDATE":
              raise SystemExit("tampered runtime receipt did not expose repair frontier")
          print("verified fail-closed runtime receipt integrity boundary")
          PY6
          mkdir -p repair
          (cd meta-ontology-go && go run ./cmd/gooo propose-repair \
            ../receipts/runtime-chain-tampered-comparison.json \
            --out ../repair)
          python3 - <<'PY7'
          import json
          from pathlib import Path

          repair = json.loads(Path("repair/repair-candidate.json").read_text())
          if repair.get("schema") != "gooo/value-execution-repair-candidate/v1":
              raise SystemExit("unexpected repair candidate schema")
          if repair.get("trigger_state") != "REFUTED":
              raise SystemExit("repair candidate trigger was not refuted")
          if repair.get("execution_allowed") is not False:
              raise SystemExit("repair candidate unexpectedly grants execution")
          if repair.get("repository_writes") != 0:
              raise SystemExit("repair candidate unexpectedly grants repository writes")
          if repair.get("next_operation") != "PRESERVE_COUNTEREXAMPLE_AND_OPEN_REPAIR_CANDIDATE":
              raise SystemExit("repair candidate lost next operation")
          print("verified non-executing repair candidate from runtime refutation")
          PY7
          runtime_provenance_wall_ms=$(( $(date +%s%3N) - runtime_started_at_ms ))
          python3 ci/write_domain_observation.py --out receipts/domain-observation.json > receipts/domain-observation-summary.txt &
          domain_observation_pid=$!
          python3 ci/write_corpus_metrics.py \
            --out receipts/corpus-metrics.json \
            --started-at-ms "$started_at_ms" \
            --generated-compile-wall-ms "$compile_wall_ms" \
            --generation-query-wall-ms "$generation_query_wall_ms" \
            --runtime-provenance-wall-ms "$runtime_provenance_wall_ms" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ci/compare_corpus_metrics.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ci/write_baseline_candidate.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ci/write_improvement_decision.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY8'
          import json
          from pathlib import Path

          decision = json.loads(Path("receipts/improvement-decision.json").read_text())
          if decision.get("execution_allowed") is not False or decision.get("repository_writes") != 0:
              raise SystemExit("improvement decision unexpectedly grants execution authority")
          if decision.get("decision") == "OBSERVED_IMPROVEMENT_CANDIDATE" and decision.get("review_required") is not True:
              raise SystemExit("improvement candidate did not require independent review")
          if not decision.get("comparison_digest", "").startswith("sha256:"):
              raise SystemExit("improvement decision lost comparison identity")
          print("verified non-executing improvement decision")
          PY8
          wait "$domain_observation_pid"
          tee -a "$GITHUB_STEP_SUMMARY" < receipts/domain-observation-summary.txt
          rm receipts/domain-observation-summary.txt
          python3 ci/write_domain_observation.py --out receipts/domain-observation-replay.json >/dev/null
          cmp receipts/domain-observation.json receipts/domain-observation-replay.json
          echo "Verified deterministic domain observation replay." >> "$GITHUB_STEP_SUMMARY"
          echo "Verified $count executable .gooo best-practice fixtures." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated corpus receipt
        uses: actions/upload-artifact@v5
        with:
          name: gooo-best-practice-corpus
          path: |
            fixtures/best-practices
            generated
            receipts
            repair

  review-improvement:
    name: Independent improvement candidate review
    needs: execute-corpus
    if: needs.execute-corpus.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout conformance lab
        uses: actions/checkout@v5
      - name: Download corpus evidence
        uses: actions/download-artifact@v6
        with:
          name: gooo-best-practice-corpus
          path: review-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Review improvement decision independently
        run: python3 ci/review_improvement_decision.py
      - name: Upload independent review receipt
        uses: actions/upload-artifact@v5
        with:
          name: gooo-independent-improvement-review
          path: review-artifact/receipts/baseline-review.json
          if-no-files-found: error
