name: Gooo best-practice corpus

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOOO_REF: 97944bfd4d606420bb163edc766a0cf2d9c5453f

jobs:
  execute-corpus:
    name: Execute every .gooo best-practice fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout conformance lab
        uses: actions/checkout@v5

      - name: Checkout pinned Gooo compiler
        uses: actions/checkout@v5
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: ${{ env.GOOO_REF }}
          path: meta-ontology-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Generate and verify corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated receipts
          count=0
          for source in fixtures/best-practices/*.gooo; do
            name="$(basename "$source" .gooo)"
  if ! (cd meta-ontology-go && go run ./cmd/gooo generate --json "../$source" --out "../generated/$name") > "receipts/$name.json"; then
    cat "receipts/$name.json"
    echo "generation failed for $source" >&2
    exit 1
  fi
            python3 ci/verify_gooo_generate.py "receipts/$name.json"
            test -n "$(find "generated/$name" -type f -name '*.go' -print -quit)"
            case "$name" in
              01-domain-model) root="billing://activity/pay-order"; target="billing://entity/order" ;;
              02-provenance-chain) root="delivery://activity/build-artifact"; target="delivery://entity/request" ;;
              03-bounded-change) root="evolution://activity/compare-candidate"; target="evolution://entity/candidate" ;;
              04-inventory-consistency) root="inventory://activity/reconcile-stock"; target="inventory://entity/order-line" ;;
              05-deployment-contract) root="platform://activity/validate-deployment"; target="platform://entity/service-contract" ;;
              06-change-review) root="governance://activity/review-repair"; target="governance://entity/problem-report" ;;
              07-self-improvement-loop) root="evolution://activity/observe-problem"; target="evolution://entity/observed-problem" ;;
              08-counterexample-guided-repair) root="repair://activity/observe-failure"; target="repair://entity/failure-observation" ;;
              09-runtime-plan) root="runtime://activity/process"; target="runtime://entity/integer" ;;
              10-runtime-chain) root="runtime-chain://activity/produce"; target="runtime-chain://entity/integer" ;;
              *) echo "unknown best-practice fixture: $name" >&2; exit 1 ;;
            esac
  if ! (cd meta-ontology-go && go run ./cmd/gooo query --json "../$source" --exact --root "$root" --relation prov:used --target "$target" --limit 10) > "receipts/$name-query.json"; then
    cat "receipts/$name-query.json"
    echo "query failed for $source" >&2
    exit 1
  fi
            python3 ci/verify_gooo_query_case.py "receipts/$name-query.json" "$root" "$target"
            count=$((count + 1))
          done
          test "$count" -eq 10
          if ! (cd meta-ontology-go && go run ./cmd/gooo run --json \
            --entry Process \
            --input ../fixtures/best-practices/run-input.json \
            ../fixtures/best-practices/09-runtime-plan.gooo) > receipts/runtime.json; then
            cat receipts/runtime.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(Path("receipts/runtime.json").read_text())
          if runtime.get("schema") != "gooo/value-execution-plan/v1":
              raise SystemExit("unexpected runtime receipt schema")
          if runtime.get("decision") != "PASS":
              raise SystemExit("Gooo runtime did not pass the value plan")
          if not runtime.get("execution", {}).get("activities"):
              raise SystemExit("runtime receipt contains no executed activity")
          print("verified Gooo value execution plan")
          (cd meta-ontology-go && go run ./cmd/gooo run --json \
            --entry Produce \
            --input ../fixtures/best-practices/run-input.json \
            ../fixtures/best-practices/10-runtime-chain.gooo) > receipts/runtime-chain.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(Path("receipts/runtime-chain.json").read_text())
          if runtime.get("decision") != "PASS":
              raise SystemExit("Gooo runtime chain did not pass")
          execution = runtime.get("execution", {})
          if execution.get("activities") != ["Produce", "Consume"]:
              raise SystemExit("runtime chain activity order was not deterministic")
          if execution.get("deliveries") != 1:
              raise SystemExit("runtime chain did not deliver one bound result")
          print("verified bound Gooo runtime chain")
          PY
          PY
          echo "Verified $count executable .gooo best-practice fixtures." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated corpus receipt
        uses: actions/upload-artifact@v5
        with:
          name: gooo-best-practice-corpus
          path: |
            fixtures/best-practices
            generated
            receipts
