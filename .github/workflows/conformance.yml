name: Development story conformance

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Public immutable artifact URL to verify
        required: false
        type: string
      artifact_sha256:
        description: Expected artifact digest in sha256:<64 hex characters> form
        required: false
        type: string
      gooo_ref:
        description: Immutable meta-ontology-go commit to execute
        required: false
        default: 060f9008e9a0c1441af8da12e72e593a049bccca
        type: string
  workflow_call:
    inputs:
      artifact_url:
        description: Public immutable artifact URL to verify
        required: true
        type: string
      artifact_sha256:
        description: Expected artifact digest in sha256:<64 hex characters> form
        required: true
        type: string
      gooo_ref:
        description: Immutable meta-ontology-go commit to execute
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gooo-conformance-lab-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate development story contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out contract
        uses: actions/checkout@v5
      - name: Validate fixture
        run: python3 ci/validate_development_story.py contracts/development-story-v1.json fixtures/development-story-unknown.json | tee development-story-result.txt
      - name: Publish result
        if: always()
        run: |
          {
            echo '## Development story conformance'
            cat development-story-result.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload normalized observation
        uses: actions/upload-artifact@v5
        with:
          name: development-story-conformance
          path: development-story-result.txt

  external-artifact:
    name: Verify external immutable artifact
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.artifact_url != '' && inputs.artifact_sha256 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out contract
        uses: actions/checkout@v5
      - name: Download public artifact
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: curl --fail --location --proto '=https' --tlsv1.2 "$ARTIFACT_URL" --output external-artifact.bin
      - name: Verify immutable digest
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: python3 ci/verify_external_artifact.py external-artifact.bin "$EXPECTED_SHA256" | tee external-artifact-result.json
      - name: Publish result
        if: always()
        run: |
          {
            echo '## External immutable artifact'
            cat external-artifact-result.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: external-artifact-verification
          path: external-artifact-result.json

  gooo-language:
    name: Execute Gooo query fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out conformance fixture
        uses: actions/checkout@v5
      - name: Check out pinned Gooo compiler
        env:
          GOOO_REF: ${{ inputs.gooo_ref || '060f9008e9a0c1441af8da12e72e593a049bccca' }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/kimjooyoon/meta-ontology-go.git meta-ontology-go
          git -C meta-ontology-go fetch --depth 1 origin "$GOOO_REF"
          git -C meta-ontology-go checkout --detach FETCH_HEAD
      - name: Execute Gooo query
        run: |
          cd meta-ontology-go
          go run ./cmd/gooo query --json ../fixtures/basic-query.gooo --exact \
            --root billing://activity/pay-order \
            --relation prov:used \
            --target billing://entity/order \
            --limit 10 > ../gooo-query-result.json
      - name: Verify language result
        run: python3 ci/verify_gooo_query.py gooo-query-result.json
      - name: Publish language result
        if: always()
        run: |
          {
            echo '## Gooo language execution'
            cat gooo-query-result.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload language receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gooo-language-query-receipt
          path: gooo-query-result.json

  gooo-generation:
    name: Generate Go from Gooo fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out conformance fixture
        uses: actions/checkout@v5
      - name: Check out pinned Gooo compiler
        env:
          GOOO_REF: ${{ inputs.gooo_ref || '060f9008e9a0c1441af8da12e72e593a049bccca' }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/kimjooyoon/meta-ontology-go.git meta-ontology-go
          git -C meta-ontology-go fetch --depth 1 origin "$GOOO_REF"
          git -C meta-ontology-go checkout --detach FETCH_HEAD
      - name: Generate Go
        run: |
          mkdir generated
          cd meta-ontology-go
          go run ./cmd/gooo generate --json ../fixtures/basic-query.gooo --out ../generated > ../gooo-generate-result.json
      - name: Verify generation result
        run: |
          python3 ci/verify_gooo_generate.py gooo-generate-result.json
          test -n "$(find generated -type f -name '*.go' -print -quit)"
      - name: Publish generation result
        if: always()
        run: |
          {
            echo '## Gooo generation'
            cat gooo-generate-result.json 2>/dev/null || true
            echo 'Generated Go files:'
            find generated -type f -name '*.go' -print 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generation receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gooo-generation-receipt
          path: |
            gooo-generate-result.json
            generated
