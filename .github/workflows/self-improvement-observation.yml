name: Gooo self-improvement observation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOOO_REF: 97944bfd4d606420bb163edc766a0cf2d9c5453f

jobs:
  observe-and-propose:
    name: Observe and propose from .gooo authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout conformance lab
        uses: actions/checkout@v5

      - name: Checkout pinned Gooo compiler
        uses: actions/checkout@v5
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: ${{ env.GOOO_REF }}
          path: meta-ontology-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Run bounded observation and proposal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observation proposal authorization adoption
          (cd meta-ontology-go && go run ./cmd/gooo observe \
            ../fixtures/self-improvement-observation/observation.gooo \
            --input ../fixtures/self-improvement-observation/input.gooo \
            --out ../observation)
          test -s observation/compiler-observation.json
          (cd meta-ontology-go && go run ./cmd/gooo propose \
            ../observation/compiler-observation.json \
            --out ../proposal)
          test -s proposal/adoption-proposal.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          observation = json.loads(Path("observation/compiler-observation.json").read_text())
          proposal = json.loads(Path("proposal/adoption-proposal.json").read_text())
          if not observation.get("candidates"):
              raise SystemExit("observation emitted no candidate")
          if proposal.get("execution_allowed") is not False:
              raise SystemExit("proposal unexpectedly grants execution")
          if proposal.get("repository_writes") != 0:
              raise SystemExit("proposal declares repository writes")
          proposal_digest = "sha256:" + __import__("hashlib").sha256(
              Path("proposal/adoption-proposal.json").read_bytes()
          ).hexdigest()
          authorization = {
              "schema": "gooo/semantic-self-adoption-authorization/v1",
              "authorization_id": "ci-explicit-denial-v1",
              "authorization_mode": "explicit-human-input",
              "proposal_digest": proposal_digest,
              "candidate_stable_id": proposal["candidate"]["stable_id"],
              "candidate_input_digest": proposal["candidate"]["input_digest"],
              "contract_digest": proposal["contract_digest"],
              "input_source_digest": proposal["input_source_digest"],
              "authorized": False,
              "repository_writes": 0,
              "local_test_executions": 0,
          }
          Path("authorization/denied.json").write_text(
              json.dumps(authorization, indent=2) + "\n"
          )
          print("verified bounded observation and proposal-only adoption boundary")
          PY
          if (cd meta-ontology-go && go run ./cmd/gooo adopt \
            ../fixtures/self-improvement-observation/observation.gooo \
            --input ../fixtures/self-improvement-observation/input.gooo \
            --observation ../observation/compiler-observation.json \
            --proposal ../proposal/adoption-proposal.json \
            --authorization ../authorization/denied.json \
            --out ../adoption); then
            echo "invalid authorization was accepted" >&2
            exit 1
          fi
          test ! -e adoption/adoption-result.json
          echo "verified fail-closed invalid authorization without adoption fallback"
          echo "Verified bounded observation and proposal-only adoption boundary." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload observation and proposal receipts
        uses: actions/upload-artifact@v5
        with:
          name: gooo-self-improvement-observation
          path: |
            fixtures/self-improvement-observation
            observation
            proposal
            authorization
            adoption
